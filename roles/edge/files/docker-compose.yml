# The hetzner host's public entry. See docs/edge.md. Traefik reaches Docker
# only through edge-socket-proxy (read-only, GET-only allowlist). It publishes
# 80 and 443, which the host firewall (infra-firewall, ufw) and the Hetzner
# Cloud Firewall admit from Cloudflare's ranges alone: Cloudflare proxies every
# public name (SSL/TLS Full (strict)). 80 only redirects to https; 443 serves
# the Cloudflare Origin CA certificate and requires Cloudflare's client
# certificate (Authenticated Origin Pulls), both in dynamic/tls.yml, which
# every release writes (infra-apply). CLOUDFLARE_IPS in .env (provisioning,
# from tasks/cloudflare-ips.yml) are the only forwarders whose X-Forwarded-*
# headers Traefik keeps.
name: edge

services:
  edge-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    container_name: edge-socket-proxy
    mem_limit: 32m
    restart: always
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=traefik
      - -allowHEAD=(/v1\.\d+)?/_ping
      - -allowGET=(/v1\.\d+)?/(_ping|version|containers/(json|[^/]+/json)|events)
      - -shutdowngracetime=5
      - -watchdoginterval=10
      - -stoponwatchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge-socket

  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: edge-traefik
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://edge-socket-proxy:2375
      - --providers.docker.network=edge
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.forwardedHeaders.trustedIPs=${CLOUDFLARE_IPS:?}
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${CLOUDFLARE_IPS:?}
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1800s
      - --log.level=ERROR
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dynamic:/dynamic:ro
    networks:
      - edge
      - edge-socket
    depends_on:
      - edge-socket-proxy

networks:
  edge:
    name: edge
    external: true
  edge-socket:
    name: edge-socket
    internal: true
