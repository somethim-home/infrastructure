# Portfolio stack, on the hetzner host. See docs/stacks.md.
# .env (image and domains) only feeds interpolation; the container reads its
# secrets from portfolio.env alone. Its media is in Cloudflare R2 (the
# R2_* settings in portfolio.env), so the stack keeps no volume. The media
# that lived in the portfolio-media volume on the home server was not migrated
# (owner, 2026-10-28): the portfolio started on this host with an empty
# database and empty buckets (RUNBOOK.md, "Hetzner host").
name: portfolio

services:
  portfolio:
    image: ${PORTFOLIO_IMAGE}
    container_name: portfolio
    mem_limit: 768m
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: portfolio.env
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.portfolio.rule=Host(`${APEX_DOMAIN}`) || Host(`${PREVIEW_DOMAIN}`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.services.portfolio.loadbalancer.server.port=3000
      - traefik.http.routers.portfolio-www.rule=Host(`${WWW_DOMAIN}`)
      - traefik.http.routers.portfolio-www.entrypoints=websecure
      - traefik.http.routers.portfolio-www.middlewares=portfolio-www-redirect
      - traefik.http.routers.portfolio-www.service=portfolio
      - traefik.http.middlewares.portfolio-www-redirect.redirectregex.regex=^https?://www\.arbikullakshi\.com/(.*)
      - traefik.http.middlewares.portfolio-www-redirect.redirectregex.replacement=https://arbikullakshi.com/$${1}
      - traefik.http.middlewares.portfolio-www-redirect.redirectregex.permanent=true

networks:
  edge:
    name: edge
    external: true
  data:
    name: data
    external: true
